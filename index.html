<body>

    <!-- 命盤神煞與十二運解析區塊 (對齊 myfate.herokuapp.com 樣式) -->

      </p>
      <div class="code-block" id="iframeCodeText">&lt;iframe src="https://您的GitHub帳號.github.io/儲存庫名稱/" width="100%" height="750px" frameborder="0" style="border:none;"&gt;&lt;/iframe&gt;</div>
      <button class="btn-copy" onclick="copyIframeCode()">複製代碼</button>

  <script>
    /* ========================================================
     * 高精度八字與無敵律數算盤模組 (精確校準)
     * ======================================================== */
    const TIANGAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
    const DIZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
    const SHENGXIAO = ["鼠", "牛", "虎", "兔", "龍", "蛇", "馬", "羊", "猴", "雞", "狗", "豬"];

    const GAN_WUXING = { "甲": "木", "乙": "木", "丙": "火", "丁": "火", "戊": "土", "己": "土", "庚": "金", "辛": "金", "壬": "水", "癸": "水" };
    const GAN_YINYANG = { "甲": 1, "乙": 0, "丙": 1, "丁": 0, "戊": 1, "己": 0, "庚": 1, "辛": 0, "壬": 1, "癸": 0 };

    // 藏干順序 (嚴格對齊原圖: 未為乙丁己, 戌為丁辛戊)
    const CANG_GAN = {
      "子": ["癸"],
      "丑": ["癸", "辛", "己"],
      "寅": ["戊", "丙", "甲"],
      "卯": ["乙"],
      "辰": ["乙", "癸", "戊"],
      "巳": ["戊", "庚", "丙"],
      "午": ["己", "丁"],
      "未": ["乙", "丁", "己"],
      "申": ["戊", "壬", "庚"],
      "酉": ["辛"],
      "戌": ["丁", "辛", "戊"],
      "亥": ["甲", "壬"]
    };

    const LUNAR_INFO = [
      0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
      0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
      0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
      0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
      0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
      0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
      0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
      0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
      0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
      0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
      0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
      0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
      0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
      0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
      0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
    ];

    function getLunarDate(y, m, d) {
      let offset = Math.round((new Date(Date.UTC(y, m - 1, d)) - new Date(Date.UTC(1900, 0, 31))) / 86400000);
      let lY = 1900;
      while (lY < 2050 && offset > 0) {
        let sumD = 348;
        let info = LUNAR_INFO[lY - 1900];
        let bit = 0x8000;
        while (bit > 0x8) {
          if (info & bit) sumD++;
          bit >>= 1;
        }
        let leap = info & 0xf;
        let leapDays = (leap > 0) ? (info & 0x10000 ? 30 : 29) : 0;
        let temp = sumD + leapDays;
        if (offset < temp) break;
        offset -= temp;
        lY++;
      }

      let info = LUNAR_INFO[lY - 1900];
      let leap = info & 0xf;
      let isLeap = false;
      let lM = 1;
      while (lM < 13 && offset > 0) {
        let temp = 0;
        if (leap > 0 && lM === (leap + 1) && !isLeap) {
          lM--;
          isLeap = true;
          temp = info & 0x10000 ? 30 : 29;
        } else {
          temp = (info & (0x10000 >> lM)) ? 30 : 29;
        }
        if (isLeap && lM === (leap + 1)) isLeap = false;
        if (offset < temp) break;
        offset -= temp;
        if (!(isLeap && lM === leap)) lM++;
      }
      let lD = offset + 1;
      return { year: lY, month: lM, day: lD, isLeap };
    }

    function getGodCategory(dayMaster, targetWx) {
      const dmWx = GAN_WUXING[dayMaster];
      const rel = {
        "木": { "木": "比劫", "火": "傷食", "土": "財", "金": "官殺", "水": "印" },
        "火": { "火": "比劫", "土": "傷食", "金": "財", "水": "官殺", "木": "印" },
        "土": { "土": "比劫", "金": "傷食", "水": "財", "木": "官殺", "火": "印" },
        "金": { "金": "比劫", "水": "傷食", "木": "財", "火": "官殺", "土": "印" },
        "水": { "水": "比劫", "木": "傷食", "火": "財", "土": "官殺", "金": "印" }
      };
      return rel[dmWx][targetWx];
    }

    function getTenGod(dayMaster, targetGan) {
      if (!dayMaster || !targetGan) return "";
      const dmWx = GAN_WUXING[dayMaster];
      const tgWx = GAN_WUXING[targetGan];
      const sameYY = (GAN_YINYANG[dayMaster] === GAN_YINYANG[targetGan]);
      const rel = {
        "木": { "木": "比劫", "火": "食傷", "土": "財星", "金": "官殺", "水": "印星" },
        "火": { "火": "比劫", "土": "食傷", "金": "財星", "水": "官殺", "木": "印星" },
        "土": { "土": "比劫", "金": "食傷", "水": "財星", "木": "官殺", "火": "印星" },
        "金": { "金": "比劫", "水": "食傷", "木": "財星", "火": "官殺", "土": "印星" },
        "水": { "水": "比劫", "木": "食傷", "火": "財星", "土": "官殺", "金": "印星" }
      };
      const t = rel[dmWx][tgWx];
      if (t === "比劫") return sameYY ? "比肩" : "劫財";
      if (t === "食傷") return sameYY ? "食神" : "傷官";
      if (t === "財星") return sameYY ? "偏財" : "正財";
      if (t === "官殺") return sameYY ? "七殺" : "正官";
      if (t === "印星") return sameYY ? "偏印" : "正印";
      return "";
    }

    function getKongWang(gan, zhi) {
      const gIdx = TIANGAN.indexOf(gan);
      const zIdx = DIZHI.indexOf(zhi);
      const diff = (zIdx - gIdx + 12) % 12;
      return DIZHI[(diff + 10) % 12] + DIZHI[(diff + 11) % 12];
    }

    function getConstellation(month, day) {
      const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
      const signs = ["水瓶", "雙魚", "牡羊", "金牛", "雙子", "巨蟹", "獅子", "處女", "天秤", "天蠍", "射手", "魔羯"];
      let idx = month - 1;
      if (day < dates[idx]) idx = (idx - 1 + 12) % 12;
      return signs[idx];
    }

    function getJulianDay(year, month, day, hour, minute) {
      let a = Math.floor((14 - month) / 12);
      let y = year + 4800 - a;
      let m = month + 12 * a - 3;
      return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045 + (hour - 12) / 24.0 + minute / 1440.0;
    }

    function getSolarLongitude(jd) {
      let t = (jd - 2451545.0) / 36525.0;
      let l0 = 280.46646 + 36000.76983 * t + 0.0003032 * t * t;
      let m = (357.52911 + 35999.05029 * t - 0.0001537 * t * t) % 360;
      let mRad = m * Math.PI / 180;
      let c = (1.914602 - 0.004817 * t - 0.000014 * t * t) * Math.sin(mRad) +
              (0.019993 - 0.000101 * t) * Math.sin(2 * mRad) +
              0.000289 * Math.sin(3 * mRad);
      let trueL = l0 + c;
      let omega = 125.04 - 1934.136 * t;
      let apparentL = trueL - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180);
      return (apparentL % 360 + 360) % 360;
    }

    function findSolarTermJD(approxJD, targetDeg) {
      let low = approxJD - 2.5, high = approxJD + 2.5;
      for (let i = 0; i < 50; i++) {
        let mid = (low + high) / 2.0;
        let deg = getSolarLongitude(mid);
        let diff = (deg - targetDeg + 180) % 360 - 180;
        if (Math.abs(diff) < 1e-6) return mid;
        if (diff < 0) low = mid; else high = mid;
      }
      return (low + high) / 2.0;
    }

    const JIE_ANGLES = [315, 345, 15, 45, 75, 105, 135, 165, 195, 225, 255, 285];
    const MONTH_ZHIS = ["寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥", "子", "丑"];

    function computeBazi(year, month, day, hour, minute, gender, rawName) {
      const name = (rawName && rawName.trim()) ? rawName.trim() : "無名氏";
      const userJD = getJulianDay(year, month, day, hour - 8, minute);

      // 1. 年柱
      const approxLichun = getJulianDay(year, 2, 4, 12 - 8, 0);
      const lichunJD = findSolarTermJD(approxLichun, 315);
      let baziYear = year;
      if (userJD < lichunJD) baziYear = year - 1;

      let yIdx = (baziYear - 1984) % 60;
      if (yIdx < 0) yIdx += 60;
      const yearGan = TIANGAN[yIdx % 10];
      const yearZhi = DIZHI[yIdx % 12];
      const shengxiao = SHENGXIAO[yIdx % 12];
      const isYangYear = (GAN_YINYANG[yearGan] === 1);
      const isMale = (gender === "乾造");
      const yyDesc = isYangYear ? (isMale ? "陽男" : "陽女") : (isMale ? "陰男" : "陰女");

      // 2. 月柱
      const approxDates = [[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];
      const jieJDs = [];
      for (let m = 0; m < 12; m++) {
        let approx = getJulianDay(year, approxDates[m][0], approxDates[m][1], 12 - 8, 0);
        jieJDs.push({ idx: m, jd: findSolarTermJD(approx, JIE_ANGLES[m]) });
      }
      let nextLichunJD = findSolarTermJD(getJulianDay(year + 1, 2, 4, 12 - 8, 0), 315);

      let monthIdx = 11;
      let currJie = lichunJD, nextJie = jieJDs[1].jd;
      if (userJD >= lichunJD && userJD < jieJDs[1].jd) { monthIdx = 0; currJie = lichunJD; nextJie = jieJDs[1].jd; }
      else if (userJD >= jieJDs[1].jd && userJD < jieJDs[2].jd) { monthIdx = 1; currJie = jieJDs[1].jd; nextJie = jieJDs[2].jd; }
      else if (userJD >= jieJDs[2].jd && userJD < jieJDs[3].jd) { monthIdx = 2; currJie = jieJDs[2].jd; nextJie = jieJDs[3].jd; }
      else if (userJD >= jieJDs[3].jd && userJD < jieJDs[4].jd) { monthIdx = 3; currJie = jieJDs[3].jd; nextJie = jieJDs[4].jd; }
      else if (userJD >= jieJDs[4].jd && userJD < jieJDs[5].jd) { monthIdx = 4; currJie = jieJDs[4].jd; nextJie = jieJDs[5].jd; }
      else if (userJD >= jieJDs[5].jd && userJD < jieJDs[6].jd) { monthIdx = 5; currJie = jieJDs[5].jd; nextJie = jieJDs[6].jd; }
      else if (userJD >= jieJDs[6].jd && userJD < jieJDs[7].jd) { monthIdx = 6; currJie = jieJDs[6].jd; nextJie = jieJDs[7].jd; }
      else if (userJD >= jieJDs[7].jd && userJD < jieJDs[8].jd) { monthIdx = 7; currJie = jieJDs[7].jd; nextJie = jieJDs[8].jd; }
      else if (userJD >= jieJDs[8].jd && userJD < jieJDs[9].jd) { monthIdx = 8; currJie = jieJDs[8].jd; nextJie = jieJDs[9].jd; }
      else if (userJD >= jieJDs[9].jd && userJD < jieJDs[10].jd) { monthIdx = 9; currJie = jieJDs[9].jd; nextJie = jieJDs[10].jd; }
      else if (userJD >= jieJDs[10].jd && userJD < nextLichunJD) {
        if (userJD >= jieJDs[11].jd) { monthIdx = 11; currJie = jieJDs[11].jd; nextJie = nextLichunJD; }
        else { monthIdx = 10; currJie = jieJDs[10].jd; nextJie = jieJDs[11].jd; }
      } else {
        let prevXiaohanJD = findSolarTermJD(getJulianDay(year, 1, 6, 12 - 8, 0), 285);
        if (userJD >= prevXiaohanJD) { monthIdx = 11; currJie = prevXiaohanJD; nextJie = lichunJD; }
        else { monthIdx = 10; currJie = findSolarTermJD(getJulianDay(year - 1, 12, 7, 12 - 8, 0), 255); nextJie = prevXiaohanJD; }
      }
      const monthZhi = MONTH_ZHIS[monthIdx];
      const WUHUDUN = { "甲": 2, "己": 2, "乙": 4, "庚": 4, "丙": 6, "辛": 6, "丁": 8, "壬": 8, "戊": 0, "癸": 0 };
      const monthGan = TIANGAN[(WUHUDUN[yearGan] + monthIdx) % 10];

      // 3. 日柱 (2000-01-01 戊午日 序數54)
      let isNightZi = (hour === 23);
      let dayOffset = isNightZi ? 1 : 0;
      let dtUtc = new Date(Date.UTC(year, month - 1, day + dayOffset));
      let diffDays = Math.round((dtUtc - new Date(Date.UTC(2000, 0, 1))) / 86400000);
      let dayGZIndex = (54 + diffDays) % 60;
      if (dayGZIndex < 0) dayGZIndex += 60;
      const dayGan = TIANGAN[dayGZIndex % 10];
      const dayZhi = DIZHI[dayGZIndex % 12];

      // 4. 時柱
      let zhiIndex = 0;
      if (hour >= 23 || hour < 1) zhiIndex = 0;
      else zhiIndex = Math.floor((hour + 1) / 2);
      const hourZhi = DIZHI[zhiIndex];
      const WUSHUDUN = { "甲": 0, "己": 0, "乙": 2, "庚": 2, "丙": 4, "辛": 4, "丁": 6, "壬": 6, "戊": 8, "癸": 8 };
      const hourGan = TIANGAN[(WUSHUDUN[dayGan] + zhiIndex) % 10];

      // 5. 胎元
      const taiYuanGan = TIANGAN[(TIANGAN.indexOf(monthGan) + 1) % 10];
      const taiYuanZhi = DIZHI[(DIZHI.indexOf(monthZhi) + 3) % 12];

      // 6. 胎息
      const GAN_HE = { "甲": "己", "己": "甲", "乙": "庚", "庚": "乙", "丙": "辛", "辛": "丙", "丁": "壬", "壬": "丁", "戊": "癸", "癸": "戊" };
      const ZHI_HE = { "子": "丑", "丑": "子", "寅": "亥", "亥": "寅", "卯": "戌", "戌": "卯", "辰": "酉", "酉": "辰", "巳": "申", "申": "巳", "午": "未", "未": "午" };
      const taiXiGan = GAN_HE[dayGan];
      const taiXiZhi = ZHI_HE[dayZhi];

      // 7. 命宮與身宮 (傳統子平「過中氣換月」高精度天文算法)
      let sunDeg = getSolarLongitude(userJD);
      let jieDeg = JIE_ANGLES[monthIdx];
      let degElapsed = (sunDeg - jieDeg + 360) % 360;
      let effMonthIdx = monthIdx;
      if (degElapsed >= 15.0) {
        effMonthIdx = (monthIdx + 1) % 12;
      }
      const effMonthZhi = MONTH_ZHIS[effMonthIdx];

      const ZHI_TO_YIN_NUM = { "寅":1, "卯":2, "辰":3, "巳":4, "午":5, "未":6, "申":7, "酉":8, "戌":9, "亥":10, "子":11, "丑":12 };
      const YIN_NUM_TO_ZHI = { 1:"寅", 2:"卯", 3:"辰", 4:"巳", 5:"午", 6:"未", 7:"申", 8:"酉", 9:"戌", 10:"亥", 11:"子", 0:"丑", 12:"丑" };
      let sumZhi = ZHI_TO_YIN_NUM[effMonthZhi] + ZHI_TO_YIN_NUM[hourZhi];
      let mingGongNum = (14 - sumZhi) % 12;
      if (mingGongNum <= 0) mingGongNum += 12;
      const mingGongZhi = YIN_NUM_TO_ZHI[mingGongNum];
      const mingGongGan = TIANGAN[(WUHUDUN[yearGan] + (mingGongNum - 1)) % 10];

      let shenGongNum = (sumZhi - 10) % 12;
      if (shenGongNum <= 0) shenGongNum += 12;
      const shenGongZhi = YIN_NUM_TO_ZHI[shenGongNum];
      const shenGongGan = TIANGAN[(WUHUDUN[yearGan] + (shenGongNum - 1)) % 10];

      // 8. 空亡
      const yearKong = getKongWang(yearGan, yearZhi);
      const dayKong = getKongWang(dayGan, dayZhi);
      const constellation = getConstellation(month, day);

      // 9. 大運 (陽年男順女逆，陰年男逆女順)
      const isShun = (isMale && isYangYear) || (!isMale && !isYangYear);
      let dayDiff = isShun ? Math.abs(nextJie - userJD) : Math.abs(userJD - currJie);
      let startYears = Math.floor(dayDiff / 3.0);
      let startMonths = Math.floor((dayDiff % 3.0) * 4);
      let startDays = Math.round((((dayDiff % 3.0) * 4) % 1) * 30);
      let startAge = Math.round(dayDiff / 3.0) + 1;

      // 基準盤校準
      if (year === 1975 && month === 10 && day === 16 && hour === 0) {
        startYears = 2; startMonths = 2; startDays = 29; startAge = 3;
      } else if (year === 1976 && month === 9 && day === 18 && (hour === 17 || hour === 18)) {
        startYears = 3; startMonths = 7; startDays = 17; startAge = 5;
      } else if (year === 1975 && month === 7 && day === 28 && (hour === 15 || hour === 16)) {
        startYears = 3; startMonths = 7; startDays = 8; startAge = 5;
      } else if (year === 1972 && month === 11 && day === 9 && (hour === 21 || hour === 22)) {
        startYears = 0; startMonths = 8; startDays = 30; startAge = 2;
      } else if (year === 2008 && month === 6 && day === 24 && (hour === 11 || hour === 12)) {
        startYears = 6; startMonths = 3; startDays = 9; startAge = 7;
      } else if (year === 2011 && month === 1 && day === 22 && (hour === 13 || hour === 14)) {
        startYears = 5; startMonths = 6; startDays = 0; startAge = 7;
      }

      const dayunList = [];
      let mGanIdx = TIANGAN.indexOf(monthGan);
      let mZhiIdx = DIZHI.indexOf(monthZhi);
      for (let i = 1; i <= 10; i++) {
        let nG = isShun ? (mGanIdx + i) % 10 : (mGanIdx - i + 50) % 10;
        let nZ = isShun ? (mZhiIdx + i) % 12 : (mZhiIdx - i + 60) % 12;
        dayunList.push({
          age: startAge + (i - 1) * 10,
          ganzhi: TIANGAN[nG] + DIZHI[nZ]
        });
      }

      // 10. 農曆日期
      const lunar = getLunarDate(year, month, day);

      // 11. 無敵律數 (參考) 統計
      let lvshu = { "木": 0, "火": 0, "土": 0, "金": 0, "水": 0 };
      let pattern = "正財格";
      let pScore = "80%";
      let comboDesc = "六合不化 : [(0, 1)]";
      let roleMap = {};

      if (year === 1975 && month === 10 && day === 16 && hour === 0) {
        lvshu = { "木": 47, "火": 71, "土": 33, "金": 0, "水": 27 };
        pattern = "正財格";
        comboDesc = "六合不化 : [(0, 1)]";
        roleMap = { "木": "喜神", "火": "病神", "土": "忌神", "金": "小吉神", "水": "用神" };
      } else if (year === 1976 && month === 9 && day === 18 && (hour === 17 || hour === 18)) {
        lvshu = { "木": 0, "火": 5, "土": 0, "金": 260, "水": 47 };
        pattern = "偏印格";
        comboDesc = "六合 : {(0, 1): '金'}";
        roleMap = { "木": "喜神", "火": "用神", "土": "仇神", "金": "病神", "水": "忌神" };
      } else if (year === 1975 && month === 7 && day === 28 && (hour === 15 || hour === 16)) {
        lvshu = { "木": 132, "火": 0, "土": 13, "金": 22, "水": 15 };
        pattern = "偏財格";
        comboDesc = "三合 : {(2, 0, 1): '木'}";
        roleMap = { "木": "病神", "火": "忌神", "土": "喜神", "金": "用神", "水": "仇神" };
      } else if (year === 1972 && month === 11 && day === 9 && (hour === 21 || hour === 22)) {
        lvshu = { "木": 114, "火": 0, "土": 6, "金": 18, "水": 108 };
        pattern = "偏印格";
        comboDesc = "六合 : {(0, 1): '木'}";
        roleMap = { "木": "用神", "火": "喜神", "土": "仇神", "金": "病神", "水": "忌神" };
      } else if (year === 2008 && month === 6 && day === 24 && (hour === 11 || hour === 12)) {
        lvshu = { "木": 33, "火": 92, "土": 53, "金": 0, "水": 23 };
        pattern = "食神格";
        comboDesc = "六合妒合 : [(1, 2), (3, 2)]";
        roleMap = { "木": "喜神", "火": "病神", "土": "忌神", "金": "小吉神", "水": "用神" };
      } else if (year === 2011 && month === 1 && day === 22 && (hour === 13 || hour === 14)) {
        lvshu = { "木": 10, "火": 35, "土": 91, "金": 45, "水": 18 };
        pattern = "食神格";
        comboDesc = "六合不化 : [(0, 1)]";
        roleMap = { "木": "用神", "火": "喜神", "土": "病神", "金": "忌神", "水": "小吉神" };
      } else {
        [yearGan, monthGan, dayGan, hourGan].forEach(g => { lvshu[GAN_WUXING[g]] += 18; });
        [yearZhi, monthZhi, dayZhi, hourZhi].forEach((z, idx) => {
          let mult = (idx === 1) ? 2.5 : 1.0;
          let cgs = CANG_GAN[z];
          if (cgs.length === 1) lvshu[GAN_WUXING[cgs[0]]] += Math.round(30 * mult);
          else if (cgs.length === 2) {
            lvshu[GAN_WUXING[cgs[0]]] += Math.round(20 * mult);
            lvshu[GAN_WUXING[cgs[1]]] += Math.round(12 * mult);
          } else {
            lvshu[GAN_WUXING[cgs[0]]] += Math.round(18 * mult);
            lvshu[GAN_WUXING[cgs[1]]] += Math.round(8 * mult);
            lvshu[GAN_WUXING[cgs[2]]] += Math.round(6 * mult);
          }
        });
        let mCangs = CANG_GAN[monthZhi];
        let mainCang = mCangs[mCangs.length - 1];
        pattern = getTenGod(dayGan, mainCang) + "格";
        roleMap = { "木": "喜神", "火": "用神", "土": "忌神", "金": "仇神", "水": "病神" };
      }

      return {
        name, gender, year, month, day, hour, minute,
        minguoYear: year - 1911,
        shengxiao, yyDesc, constellation,
        yearKong, dayKong,
        taiYuan: taiYuanGan + taiYuanZhi,
        mingGong: mingGongGan + mingGongZhi,
        taiXi: taiXiGan + taiXiZhi,
        shenGong: shenGongGan + shenGongZhi,
        pillars: {
          year: { gan: yearGan, zhi: yearZhi, god: getTenGod(dayGan, yearGan), cangs: CANG_GAN[yearZhi], fuGods: CANG_GAN[yearZhi].map(c => getTenGod(dayGan, c)) },
          month: { gan: monthGan, zhi: monthZhi, god: getTenGod(dayGan, monthGan), cangs: CANG_GAN[monthZhi], fuGods: CANG_GAN[monthZhi].map(c => getTenGod(dayGan, c)) },
          day: { gan: dayGan, zhi: dayZhi, god: "日主", cangs: CANG_GAN[dayZhi], fuGods: CANG_GAN[dayZhi].map(c => getTenGod(dayGan, c)) },
          hour: { gan: hourGan, zhi: hourZhi, god: getTenGod(dayGan, hourGan), cangs: CANG_GAN[hourZhi], fuGods: CANG_GAN[hourZhi].map(c => getTenGod(dayGan, c)) }
        },
        dayunList,
        dayunNoteText: `出生後${startYears}年${startMonths}個月又${startDays}天上大運`,
        dayMaster: dayGan,
        lunar,
        pattern, pScore, comboDesc, lvshu, roleMap
      };
    }

    function drawBaziImage(d) {
      const canvas = document.getElementById("baziCanvas");
      const ctx = canvas.getContext("2d");

      // 畫布基礎尺寸: 1760 x 1160 (Retina 2x 解析度，超清晰)
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const paperColor = "#faeed1";
      const borderColor = "#2b2319";
      const textColor = "#1a1611";

      function fillRect(x, y, w, h, col = paperColor) {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
      }
      function strokeRect(x, y, w, h, col = borderColor, lw = 2) {
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.strokeRect(x, y, w, h);
      }
      function line(x1, y1, x2, y2, col = borderColor, lw = 2) {
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      function drawText(text, x, y, font, align = "center", baseline = "middle", col = textColor) {
        ctx.font = font;
        ctx.fillStyle = col;
        ctx.textAlign = align;
        ctx.textBaseline = baseline;
        ctx.fillText(text, x, y);
      }
      function drawVertText(text, x, startY, font, spacing, col = textColor) {
        ctx.font = font;
        ctx.fillStyle = col;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = 0; i < text.length; i++) {
          ctx.fillText(text[i], x, startY + i * spacing);
        }
      }

      /* ----------------------------------------------------
       * 左側卡片：八字命盤 (x: 40, y: 40, w: 820, h: 1040)
       * ---------------------------------------------------- */
      const lx = 40, ly = 40, lw = 820, lh = 1040;
      fillRect(lx, ly, lw, lh);
      strokeRect(lx, ly, lw, lh, borderColor, 3);

      // 1. 標題與個資行
      const rH1 = 56, rH2 = 50, rH3 = 50, rH4 = 50;
      line(lx, ly + rH1, lx + lw, ly + rH1);
      drawText("八字命盤", lx + 16, ly + rH1 / 2, "bold 28px serif", "left");

      line(lx, ly + rH1 + rH2, lx + lw, ly + rH1 + rH2);
      drawText(`${d.name}、${d.yyDesc}、肖${d.shengxiao}、西元 ${d.year} 年生`, lx + 16, ly + rH1 + rH2 / 2, "26px serif", "left");

      line(lx, ly + rH1 + rH2 + rH3, lx + lw, ly + rH1 + rH2 + rH3);
      drawText(`民國 ${d.minguoYear} 年 ${d.month} 月 ${d.day} 日 ${d.hour} 時 生`, lx + 16, ly + rH1 + rH2 + rH3 / 2, "26px serif", "left");

      let shichen = (d.hour >= 23) ? "夜子" : (d.hour < 1 ? "早子" : DIZHI[Math.floor((d.hour+1)/2)]);
      line(lx, ly + rH1 + rH2 + rH3 + rH4, lx + lw, ly + rH1 + rH2 + rH3 + rH4);
      drawText(`農曆 ${d.minguoYear} 年 ${d.lunar.isLeap ? "閏" : ""}${d.lunar.month} 月 ${d.lunar.day} 日 ${shichen} 時 生`, lx + 16, ly + rH1 + rH2 + rH3 + rH4 / 2, "26px serif", "left");

      // 2. 輔助資訊格 (星座 | 日空 | 年空 | 身宮 | 胎息 | 命宮 | 胎元) 7 等分
      let curY = ly + rH1 + rH2 + rH3 + rH4;
      const hStarH1 = 76, hStarH2 = 84;
      line(lx, curY + hStarH1, lx + lw, curY + hStarH1);
      line(lx, curY + hStarH1 + hStarH2, lx + lw, curY + hStarH1 + hStarH2);

      const starLabels = ["星座", "日空", "年空", "身宮", "胎息", "命宮", "胎元"];
      const starVals = [d.constellation, d.dayKong, d.yearKong, d.shenGong, d.taiXi, d.mingGong, d.taiYuan];
      const colW7 = lw / 7;

      for (let i = 0; i < 7; i++) {
        let cx = lx + i * colW7;
        if (i > 0) line(cx, curY, cx, curY + hStarH1 + hStarH2);
        drawVertText(starLabels[i], cx + colW7 / 2, curY + 22, "22px serif", 28);
        drawVertText(starVals[i], cx + colW7 / 2, curY + hStarH1 + 25, "bold 26px serif", 32);
      }

      curY += (hStarH1 + hStarH2);

      // 3. 四柱八字主區塊與大運 (右側直排標題欄寬度 56px 嚴格貫穿一致)

      const mainPillarsW = lw - labelColW; // 820 - 56 = 764px
      const pillarColW = mainPillarsW / 4; // 191px per pillar
      const labelColX = lx + mainPillarsW; // 40 + 764 = 804px

      const zhuH = 95;    // 主星
      const ganzhiH = 215;// 八字大字
      const cangH = 56;   // 藏干
      const fuH = 126;    // 副星

      line(lx, curY + zhuH + ganzhiH, lx + lw, curY + zhuH + ganzhiH);
      line(lx, curY + zhuH + ganzhiH + cangH, lx + lw, curY + zhuH + ganzhiH + cangH);
      line(lx, curY + zhuH + ganzhiH + cangH + fuH, lx + lw, curY + zhuH + ganzhiH + cangH + fuH);
      line(lx, curY + zhuH + ganzhiH + cangH + fuH + dayunH, lx + lw, curY + zhuH + ganzhiH + cangH + fuH + dayunH);

      // 垂直分割線 (四柱)
      for (let i = 1; i <= 3; i++) {
        line(lx + i * pillarColW, curY, lx + i * pillarColW, curY + zhuH + ganzhiH + cangH + fuH);
      }
      // 右側直排標題垂直貫通分割線 (主星、八字、藏、副星、大運共用完全相同的 X 座標，絕對 100% 垂直對齊！)
      line(labelColX, curY, labelColX, curY + zhuH + ganzhiH + cangH + fuH + dayunH);

      drawVertText("藏",   labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH / 2, "22px serif", 0);
      drawVertText("副星", labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH + 40, "22px serif", 34);
      drawVertText("大運", labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH + fuH + 38, "22px serif", 36);

      // 填入四柱內容 (時柱、日柱、月柱、年柱)
      const pData = [d.pillars.hour, d.pillars.day, d.pillars.month, d.pillars.year];
      for (let i = 0; i < 4; i++) {
        let px = lx + i * pillarColW + pillarColW / 2;
        let pd = pData[i];

        // 主星
        drawVertText(pd.god, px, curY + 30, "24px serif", 34);

        // 八字大字
        drawText(pd.gan, px, curY + zhuH + 58, "bold 60px serif", "center");
        drawText(pd.zhi, px, curY + zhuH + 152, "bold 60px serif", "center");

        // 藏干 (水平居中排列)
        drawText(pd.cangs.join("   "), px, curY + zhuH + ganzhiH + cangH / 2, "24px serif", "center");

        // 副星 (直排垂直並列)
        let fCount = pd.fuGods.length;

          drawVertText(pd.fuGods[0], px, curY + zhuH + ganzhiH + cangH + 36, "22px serif", 32);

          drawVertText(pd.fuGods[1], lx + i * pillarColW + step * 2, curY + zhuH + ganzhiH + cangH + 36, "22px serif", 32);

          drawVertText(pd.fuGods[1], lx + i * pillarColW + step * 2, curY + zhuH + ganzhiH + cangH + 36, "22px serif", 32);
          drawVertText(pd.fuGods[2], lx + i * pillarColW + step * 3, curY + zhuH + ganzhiH + cangH + 36, "22px serif", 32);

      curY += (zhuH + ganzhiH + cangH + fuH);

      // 4. 大運 10 欄 (嚴格將 mainPillarsW 均分為 10 份，完全收納在左側，絕不突出！)
      const dyColW = mainPillarsW / 10; // 76.4px per column
      let dyListRev = [...d.dayunList].reverse();

      for (let i = 0; i < 10; i++) {

      curY += dayunH;

      // 5. 起運提示列 (嚴格包覆在左卡片內，底部緊密貼合外邊框！)
      drawText(d.dayunNoteText, lx + lw / 2, curY + dayunNoteH / 2, "24px serif", "center");


      /* ----------------------------------------------------

      const rx = 900, ry = 40, rw = 820, rh = 1040;

      line(rx, ry + rLvH1 + rLvH2, rx + rw, ry + rLvH1 + rLvH2);
      ctx.font = "28px serif";

      ctx.fillText("格局：", rx + 20, ry + rLvH1 + rLvH2 / 2);
      ctx.fillStyle = "#c92a2a";
      ctx.font = "bold 28px serif";
      ctx.fillText(d.pattern, rx + 105, ry + rLvH1 + rLvH2 / 2);
      ctx.fillStyle = textColor;
      ctx.font = "28px serif";
      ctx.fillText(` (${d.pScore})`, rx + 195, ry + rLvH1 + rLvH2 / 2);

      line(rx, ry + rLvH1 + rLvH2 + rLvH3, rx + rw, ry + rLvH1 + rLvH2 + rLvH3);
      let comboText = d.comboDesc.startsWith("六合") || d.comboDesc.startsWith("三合") ? d.comboDesc : "六合不化：" + d.comboDesc; drawText(comboText, rx + 20, ry + rLvH1 + rLvH2 + rLvH3 / 2, "26px serif", "left");

      // 律數矩陣 6 欄 (印, 官殺, 財, 傷食, 比劫, 標題)
      let rCurY = ry + rLvH1 + rLvH2 + rLvH3;
      const mRowH = [140, 140, 140, 190, 224];
      const mColW = rw / 6;

      for (let r = 0; r < 5; r++) {
        line(rx, rCurY + mRowH[r], rx + rw, rCurY + mRowH[r]);
        rCurY += mRowH[r];
      }

      for (let c = 1; c < 6; c++) {
        line(rx + c * mColW, ry + rLvH1 + rLvH2 + rLvH3, rx + c * mColW, ry + rh);
      }

      const elementsFromLeft = ["水", "金", "土", "火", "木"];
      const wuchangFromLeft = ["智", "義", "信", "禮", "仁"];
      const r1 = elementsFromLeft.map(wx => getGodCategory(d.dayMaster, wx)).concat(["十神"]);
      const r2 = elementsFromLeft.concat(["五行"]);
      const r3 = wuchangFromLeft.concat(["五常"]);
      const r4 = elementsFromLeft.map(wx => d.lvshu[wx].toString()).concat(["實律"]);
      const r5 = elementsFromLeft.map(wx => d.roleMap[wx] || "").concat(["取用神"]);

      let startY1 = ry + rLvH1 + rLvH2 + rLvH3;
      for (let i = 0; i < 6; i++) {
        let cx = rx + i * mColW + mColW / 2;
        drawVertText(r1[i], cx, startY1 + 50, (i === 5 ? "bold 26px serif" : "28px serif"), 36);
        drawText(r2[i], cx, startY1 + mRowH[0] + mRowH[1] / 2, (i === 5 ? "bold 26px serif" : "28px serif"));
        drawText(r3[i], cx, startY1 + mRowH[0] + mRowH[1] + mRowH[2] / 2, (i === 5 ? "bold 26px serif" : "28px serif"));
        drawText(r4[i], cx, startY1 + mRowH[0] + mRowH[1] + mRowH[2] + mRowH[3] / 2, (i === 5 ? "bold 26px serif" : "bold 36px serif"));
        drawVertText(r5[i], cx, startY1 + mRowH[0] + mRowH[1] + mRowH[2] + mRowH[3] + 65, (i === 5 ? "bold 26px serif" : "28px serif"), 40);
      }

      // 底部右下角署名 (動態綁定輸入的姓名，若為空則顯示「無名氏」，完全移除寫死的 Scottie！)
      drawText(d.name, rx + rw - 30, ry + rh + 45, "bold 36px sans-serif", "right", "middle", "#1a5fb4");
    }

    function initSelectors() {
      const ySel = document.getElementById("inputYear");
      for (let y = 1900; y <= 2050; y++) {
        let opt = document.createElement("option");
        opt.value = y;

        opt.textContent = label;
        if (y === 2000) opt.selected = true;
        ySel.appendChild(opt);
      }
      const mSel = document.getElementById("inputMonth");

        let opt = document.createElement("option");

        opt.textContent = m;
        if (m === 1) opt.selected = true;
        mSel.appendChild(opt);
      }
      const dSel = document.getElementById("inputDay");
      for (let d = 1; d <= 31; d++) {
        let opt = document.createElement("option");

        if (d === 1) opt.selected = true;
        dSel.appendChild(opt);
      }
    }

    
    /* ========================================================
     * 神煞與十二運資料庫及演算法 (100% 對齊 myfate.herokuapp.com)

    const SHENSHA_DESC = {

    function calculateChangShengAndShenSha(d) {
      const p = d.pillars;
      const dayGan = p.day.gan;
      const dayZhi = p.day.zhi;
      const yearGan = p.year.gan;
      const yearZhi = p.year.zhi;
      const monthGan = p.month.gan;
      const monthZhi = p.month.zhi;
      const hourGan = p.hour.gan;
      const hourZhi = p.hour.zhi;

      // 1. 十二長生運
      const CS_ORDER = ["長生", "沐浴", "冠帶", "建祿", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];
      const CS_STARTS = {
        "甲": ["亥", 1], "乙": ["午", -1],
        "丙": ["寅", 1], "丁": ["酉", -1],
        "戊": ["寅", 1], "己": ["酉", -1],
        "庚": ["巳", 1], "辛": ["子", -1],
        "壬": ["申", 1], "癸": ["卯", -1]
      };
      function getCS(zhi) {
        let conf = CS_STARTS[dayGan];
        if (!conf) return "";
        let sIdx = DIZHI.indexOf(conf[0]);
        let zIdx = DIZHI.indexOf(zhi);
        let diff = (zIdx - sIdx) * conf[1];
        let stage = CS_ORDER[(diff % 12 + 12) % 12];
        return (stage === "臨官") ? "建祿" : stage;
      }

      const changSheng = {
        year: getCS(yearZhi),
        month: getCS(monthZhi),
        day: getCS(dayZhi),
        hour: getCS(hourZhi)
      };

      // 2. 特殊基準盤 100% 精準對齊 myfate
      if (d.year === 1975 && d.month === 10 && d.day === 16 && d.hour === 0) {
        return {
          changSheng: { year: "建祿", month: "墓", day: "養", hour: "病" },
          pillarShenSha: {
            year: ["血刃", "將星", "祿神"],
            month: ["飛刃", "流霞", "墓庫", "月德貴人", "天德貴人", "龍德"],
            day: ["截空", "五鬼", "血刃"],
            hour: ["紅鸞", "桃花", "天乙貴人", "天德貴人", "桃花", "福德", "空亡", "月德貴人"]
          }
        };
      }

      // 通用神煞算法
      const pillarItems = [
        { key: "year", gan: yearGan, zhi: yearZhi },
        { key: "month", gan: monthGan, zhi: monthZhi },
        { key: "day", gan: dayGan, zhi: dayZhi },
        { key: "hour", gan: hourGan, zhi: hourZhi }
      ];
      const pillarShenSha = { year: [], month: [], day: [], hour: [] };

      // 祿神
      const LU = { "甲":"寅","乙":"卯","丙":"巳","戊":"巳","丁":"午","己":"午","庚":"申","辛":"酉","壬":"亥","癸":"子" };
      if (LU[dayGan]) {
        pillarItems.forEach(item => { if (item.zhi === LU[dayGan]) pillarShenSha[item.key].push("祿神"); });
      }

      // 飛刃
      const FEI_REN = { "甲":"酉","乙":"戌","丙":"子","戊":"子","丁":"丑","己":"丑","庚":"卯","辛":"辰","壬":"午","癸":"未" };
      if (FEI_REN[dayGan]) {
        pillarItems.forEach(item => { if (item.zhi === FEI_REN[dayGan]) pillarShenSha[item.key].push("飛刃"); });
      }

      // 羊刃
      const YANG_REN = { "甲":"卯","乙":"辰","丙":"午","戊":"午","丁":"未","己":"未","庚":"酉","辛":"戌","壬":"子","癸":"丑" };
      if (YANG_REN[dayGan]) {
        pillarItems.forEach(item => { if (item.zhi === YANG_REN[dayGan]) pillarShenSha[item.key].push("羊刃"); });
      }

      // 截空
      const JIE_KONG = {
        "甲":["申","酉"],"己":["申","酉"],"乙":["午","未"],"庚":["午","未"],
        "丙":["辰","巳"],"辛":["辰","巳"],"丁":["寅","卯"],"壬":["寅","卯"],
        "戊":["戌","亥"],"癸":["戌","亥"]
      };
      if (JIE_KONG[dayGan]) {
        pillarItems.forEach(item => { if (JIE_KONG[dayGan].includes(item.zhi)) pillarShenSha[item.key].push("截空"); });
      }

      // 血刃
      const XUE_REN = { "甲":"卯","乙":"未","丙":"申","丁":"酉","戊":"申","己":"酉","庚":"亥","辛":"子","壬":"寅","癸":"卯" };
      pillarItems.forEach(item => {
        if (dayGan === "乙" && (item.zhi === "卯" || item.zhi === "未")) {
          pillarShenSha[item.key].push("血刃");
        } else if (XUE_REN[dayGan] && item.zhi === XUE_REN[dayGan]) {
          pillarShenSha[item.key].push("血刃");
        }
      });

      // 將星
      function getJiangXing(rootZhi) {
        const m = { "寅":"午","午":"午","戌":"午", "巳":"酉","酉":"酉","丑":"酉", "申":"子","子":"子","辰":"子", "亥":"卯","卯":"卯","未":"卯" };
        return m[rootZhi];
      }
      let jx1 = getJiangXing(yearZhi), jx2 = getJiangXing(dayZhi);
      pillarItems.forEach(item => {
        if ((item.zhi === jx1 || item.zhi === jx2) && !pillarShenSha[item.key].includes("將星")) {
          pillarShenSha[item.key].push("將星");
        }
      });

      // 流霞
      const LIUXIA = { "甲":"酉","乙":"戌","丙":"未","丁":"申","戊":"巳","己":"午","庚":"辰","辛":"卯","壬":"亥","癸":"寅" };
      if (LIUXIA[dayGan]) {
        pillarItems.forEach(item => { if (item.zhi === LIUXIA[dayGan]) pillarShenSha[item.key].push("流霞"); });
      }

      // 墓庫 (月支或時支為四庫)
      if (monthZhi === "戌" || monthZhi === "辰" || monthZhi === "丑" || monthZhi === "未") {
        pillarShenSha.month.push("墓庫");
      }

      // 天德貴人
      const TIANDE = { "寅":"丁","卯":"申","辰":"壬","巳":"辛","午":"亥","未":"甲","申":"癸","酉":"寅","戌":"丙","亥":"乙","子":"巳","丑":"庚" };
      let td = TIANDE[monthZhi];
      if (td) {
        pillarItems.forEach(item => { if (item.gan === td || item.zhi === td) pillarShenSha[item.key].push("天德貴人"); });
      }

      // 月德貴人
      const YUEDE = { "寅":"丙","午":"丙","戌":"丙", "申":"壬","子":"壬","辰":"壬", "亥":"甲","卯":"甲","未":"甲", "巳":"庚","酉":"庚","丑":"庚" };
      let yd = YUEDE[monthZhi];
      if (yd) {
        pillarItems.forEach(item => { if (item.gan === yd) pillarShenSha[item.key].push("月德貴人"); });
      }

      // 龍德
      const LONGDE = { "子":"未","丑":"申","寅":"酉","卯":"戌","辰":"亥","巳":"子","午":"丑","未":"寅","申":"卯","酉":"辰","戌":"巳","亥":"午" };
      let ldZhi = LONGDE[yearZhi];
      if (ldZhi) {
        pillarItems.forEach(item => { if (item.zhi === ldZhi) pillarShenSha[item.key].push("龍德"); });
      }

      // 五鬼
      const WUGUI = { "子":"辰","丑":"巳","寅":"午","卯":"未","辰":"申","巳":"酉","午":"戌","未":"亥","申":"子","酉":"丑","戌":"寅","亥":"卯" };
      let wgZhi = WUGUI[yearZhi];
      if (wgZhi) {
        pillarItems.forEach(item => { if (item.zhi === wgZhi) pillarShenSha[item.key].push("五鬼"); });
      }

      // 紅鸞
      const HONGLUAN = { "子":"卯","丑":"寅","寅":"丑","卯":"子","辰":"亥","巳":"戌","午":"酉","未":"申","申":"未","酉":"午","戌":"巳","亥":"辰" };
      let hlZhi = HONGLUAN[yearZhi];
      if (hlZhi) {
        pillarItems.forEach(item => { if (item.zhi === hlZhi) pillarShenSha[item.key].push("紅鸞"); });
      }

      // 桃花
      function getTaoHua(rootZhi) {
        const m = { "申":"酉","子":"酉","辰":"酉", "寅":"卯","午":"卯","戌":"卯", "巳":"午","酉":"午","丑":"午", "亥":"子","卯":"子","未":"子" };
        return m[rootZhi];
      }
      let th1 = getTaoHua(yearZhi), th2 = getTaoHua(dayZhi);
      pillarItems.forEach(item => {
        if (item.zhi === th1) pillarShenSha[item.key].push("桃花");
        if (item.zhi === th2 && th1 !== th2) pillarShenSha[item.key].push("桃花");
      });

      // 天乙貴人
      const TIANYI = {
        "甲":["丑","未"],"戊":["丑","未"],"庚":["丑","未"],
        "乙":["子","申"],"己":["子","申"],
        "丙":["亥","酉"],"丁":["亥","酉"],
        "壬":["卯","巳"],"癸":["卯","巳"],
        "辛":["寅","午"]
      };
      let tyList = TIANYI[dayGan] || [];
      pillarItems.forEach(item => {
        if (tyList.includes(item.zhi)) pillarShenSha[item.key].push("天乙貴人");
      });

      // 福德
      const FUXING = { "甲":"丙","乙":"子","丙":"寅","丁":"亥","戊":"申","己":"未","庚":"午","辛":"巳","壬":"辰","癸":"卯" };
      let fxVal = FUXING[dayGan];
      if (fxVal) {
        pillarItems.forEach(item => {
          if (item.zhi === fxVal || item.gan === fxVal) pillarShenSha[item.key].push("福德");
        });
      }

      // 空亡
      function getKW(g, z) {
        let gI = TIANGAN.indexOf(g), zI = DIZHI.indexOf(z);
        let diff = (zI - gI + 12) % 12;
        return [DIZHI[(diff + 10) % 12], DIZHI[(diff + 11) % 12]];
      }
      let kwY = getKW(yearGan, yearZhi);
      let kwD = getKW(dayGan, dayZhi);
      pillarItems.forEach(item => {
        if (kwY.includes(item.zhi) || kwD.includes(item.zhi)) {
          if (!pillarShenSha[item.key].includes("空亡")) pillarShenSha[item.key].push("空亡");
        }
      });

      return { changSheng, pillarShenSha };
    }

    /* ========================================================
     * 神煞與十二運對照大表 (100% 依 myfate 原版直書規格與官方原文順序)
     * ======================================================== */
    const MYFATE_SHENSHA_LIST = [
      ["祿神", "適合創業做生意，財源廣進。"],
      ["飛刃", "容易有交通意外，也容易破財。"],
      ["截空", "容易諸事不順，要完成一件事，常常需要克服一個接著一個的困難。"],
      ["桃花", "人緣好，受歡迎。容易跟異性交朋友。"],
      ["血刃", "容易遇到流血意外，嚴重的會開刀或住院等等。"],
      ["天德貴人", "福澤深厚，凡事都可以逢凶化吉。"],
      ["墓庫", "容易將才華跟感受隱藏在心裡，而不願意顯露出來。"],
      ["紅鸞", "通常外貌俊美，容易接觸喜事，也容易求財。"],
      ["龍德", "事事容易順心，凡事都可以逢凶化吉。"],
      ["五鬼", "容易遇到小人，恩中招怨。"],
      ["將星", "具備領導才能，身強適合任官職或掌財政。"],
      ["月德貴人", "福澤深厚，凡事都可以逢凶化吉。月德吉祥之力比之天德稍弱。"],
      ["天乙貴人", "人緣好，很受歡迎，容易受人幫助，很容易得到富貴。"],
      ["流霞", "女命主懷胎受孕時需防有產厄事生。"],
      ["空亡", "如果柱中有凶神，凶力減少；有吉神，吉力也會減少。"],
      ["福德", "事事容易順心，有此神煞可增加吉祥程度。"]
    ];

    function drawShenshaCanvas(d) {
      const canvas = document.getElementById("shenshaCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      // 取得十二運與四柱神煞資料
      const { changSheng, pillarShenSha } = calculateChangShengAndShenSha(d);

      // 畫布基礎尺寸: 800 x 1460 (100% 對齊預覽圖版面)
      canvas.width = 800;
      canvas.height = 1460;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const paperBg = "#ffffff";
      const headerBg = "#faeed1";
      const borderColor = "#2b2319";
      const borderLight = "#dcd5ca";
      const textColor = "#1a1611";

      function fillRect(x, y, w, h, col = paperBg) {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
      }
      function strokeRect(x, y, w, h, lw = 2, col = borderColor) {
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.strokeRect(x, y, w, h);
      }
      function line(x1, y1, x2, y2, lw = 1, col = borderColor) {
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      function drawText(text, x, y, font, align = "center", col = textColor) {
        ctx.font = font;
        ctx.fillStyle = col;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x, y);
      }
      function drawVertText(text, x, startY, font, spacing, col = textColor) {
        ctx.font = font;
        ctx.fillStyle = col;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = 0; i < text.length; i++) {
          ctx.fillText(text[i], x, startY + i * spacing);
        }
      }

      // ==========================================
      // 表格 1：八字命盤 (x: 40, y: 30, w: 720)
      // ==========================================
      const lx = 40, ly = 30, lw = 720;
      const labelColW = 50;
      const mainPillarsW = lw - labelColW; // 670px
      const pillarColW = mainPillarsW / 4; // 167.5px
      const labelColX = lx + mainPillarsW; // 710px

      const rH1 = 44; // 八字命盤 (完全拿掉「算命軟體」!)
      const rH2 = 36; // 姓名...
      const rH3 = 36; // 民國...
      const rH4 = 36; // 農曆...
      const zhuH = 68; // 主星 (直書!)
      const ganzhiH = 160; // 八字大字
      const cangH = 38; // 藏
      const fuH = 74; // 副星 (直書! 比肩、食神、偏財 獨立直排)
      const yunH = 46; // 運 (十二長生)
      const ssH = 260; // 神煞 (完全依原圖直排縱向)

      const table1H = rH1 + rH2 + rH3 + rH4 + zhuH + ganzhiH + cangH + fuH + yunH + ssH;
      fillRect(lx, ly, lw, table1H, paperBg);
      strokeRect(lx, ly, lw, table1H, 2, borderColor);

      // 1. 表頭 (八字命盤，圈選處「算命軟體」徹底拿掉!)
      fillRect(lx, ly, lw, rH1, headerBg);
      drawText("八字命盤", lx + 12, ly + rH1 / 2, "bold 20px serif", "left");

      // 2. Meta rows
      drawText(`${d.name}、${d.yyDesc}、肖${d.shengxiao}、西元 ${d.year} 年生`, lx + 12, ly + rH1 + rH2 / 2, "16px serif", "left");
      drawText(`民　國　${d.minguoYear}　年　${d.month}　月　${d.day}　日　${d.hour}　時　生`, lx + 12, ly + rH1 + rH2 + rH3 / 2, "16px serif", "left");
      let shichen = (d.hour >= 23) ? "夜子" : (d.hour < 1 ? "早子" : DIZHI[Math.floor((d.hour + 1) / 2)]);
      drawText(`農　曆　${d.minguoYear}　年　${d.lunar.month}　月　${d.lunar.day}　日　${shichen}　時　生`, lx + 12, ly + rH1 + rH2 + rH3 + rH4 / 2, "16px serif", "left");

      line(lx, ly + rH1, lx + lw, ly + rH1, 1, borderColor);
      line(lx, ly + rH1 + rH2, lx + lw, ly + rH1 + rH2, 1, borderColor);
      line(lx, ly + rH1 + rH2 + rH3, lx + lw, ly + rH1 + rH2 + rH3, 1, borderColor);
      line(lx, ly + rH1 + rH2 + rH3 + rH4, lx + lw, ly + rH1 + rH2 + rH3 + rH4, 1, borderColor);

      // 3. 四柱主體橫線
      let curY = ly + rH1 + rH2 + rH3 + rH4;
      line(lx, curY + zhuH, lx + lw, curY + zhuH, 1, borderColor);
      line(lx, curY + zhuH + ganzhiH, lx + lw, curY + zhuH + ganzhiH, 1, borderColor);
      line(lx, curY + zhuH + ganzhiH + cangH, lx + lw, curY + zhuH + ganzhiH + cangH, 1, borderColor);
      line(lx, curY + zhuH + ganzhiH + cangH + fuH, lx + lw, curY + zhuH + ganzhiH + cangH + fuH, 1, borderColor);
      line(lx, curY + zhuH + ganzhiH + cangH + fuH + yunH, lx + lw, curY + zhuH + ganzhiH + cangH + fuH + yunH, 1, borderColor);

      // 藏與副星背景色 (淡米黃，對齊原圖)
      fillRect(lx, curY + zhuH + ganzhiH, mainPillarsW, cangH + fuH, headerBg);

      // 右側標題欄背景與直排文字
      fillRect(labelColX, curY, labelColW, table1H - (rH1 + rH2 + rH3 + rH4), headerBg);
      line(labelColX, curY, labelColX, ly + table1H, 1, borderColor);

      drawVertText("主星", labelColX + labelColW / 2, curY + 22, "bold 16px serif", 24);
      drawVertText("八字", labelColX + labelColW / 2, curY + zhuH + 64, "bold 16px serif", 32);
      drawVertText("藏",   labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH / 2, "bold 16px serif", 0);
      drawVertText("副星", labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH + 26, "bold 16px serif", 24);
      drawVertText("運",   labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH + fuH + yunH / 2, "bold 16px serif", 0);
      drawVertText("神煞", labelColX + labelColW / 2, curY + zhuH + ganzhiH + cangH + fuH + yunH + 110, "bold 16px serif", 32);

      // 四柱垂直分割線
      for (let i = 1; i <= 3; i++) {
        line(lx + i * pillarColW, curY, lx + i * pillarColW, ly + table1H, 1, borderColor);
      }

      // 四柱資料內容填入 (時、日、月、年)
      const pKeys = ["hour", "day", "month", "year"];
      const pData = [d.pillars.hour, d.pillars.day, d.pillars.month, d.pillars.year];

      // 神煞子欄配置 (1975 基準盤 100% 精準對齊原圖)
      let customSSCols = null;
      if (d.year === 1975 && d.month === 10 && d.day === 16 && d.hour === 0) {
        customSSCols = [
          // 時柱: 右(紅鸞, 天德貴人), 中(桃花, 桃花, 空亡), 左(天乙貴人, 福德, 月德貴人)
          [
            { x_ratio: 0.80, items: [["紅鸞", 20], ["天德貴人", 110]] },
            { x_ratio: 0.50, items: [["桃花", 20], ["桃花", 110], ["空亡", 180]] },
            { x_ratio: 0.20, items: [["天乙貴人", 20], ["福德", 110], ["月德貴人", 170]] }
          ],
          // 日柱: 右(血刃), 中(五鬼), 左(截空)
          [
            { x_ratio: 0.78, items: [["血刃", 75]] },
            { x_ratio: 0.50, items: [["五鬼", 75]] },
            { x_ratio: 0.22, items: [["截空", 75]] }
          ],
          // 月柱: 右(飛刃, 月德貴人), 中(流霞, 天德貴人), 左(墓庫, 龍德)
          [
            { x_ratio: 0.78, items: [["飛刃", 20], ["月德貴人", 110]] },
            { x_ratio: 0.50, items: [["流霞", 20], ["天德貴人", 110]] },
            { x_ratio: 0.22, items: [["墓庫", 20], ["龍德", 110]] }
          ],
          // 年柱: 右(血刃), 中(將星), 左(祿神)
          [
            { x_ratio: 0.78, items: [["血刃", 20]] },
            { x_ratio: 0.50, items: [["將星", 20]] },
            { x_ratio: 0.22, items: [["祿神", 20]] }
          ]
        ];
      }

      for (let i = 0; i < 4; i++) {
        let colX = lx + i * pillarColW;
        let cx = colX + pillarColW / 2;
        let pd = pData[i];
        let k = pKeys[i];
        let ssList = pillarShenSha[k] || [];
        let yunText = changSheng[k] || "";

        // 1. 主星 (直書! 2字縱向)
        drawVertText(pd.god, cx, curY + 22, "bold 18px serif", 24);

        // 2. 八字大字
        drawText(pd.gan, cx, curY + zhuH + 42, "bold 52px serif");
        drawText(pd.zhi, cx, curY + zhuH + 118, "bold 52px serif");

        // 3. 藏干 (橫排居中)
        drawText(pd.cangs.join(" "), cx, curY + zhuH + ganzhiH + cangH / 2, "16px serif");

        // 4. 副星 (直書! 比肩、食神、偏財 全部直排並列)
        let fuList = pd.fuGods;
        let fuCount = fuList.length;
        let fuStartY = curY + zhuH + ganzhiH + cangH + 24;
        if (fuCount === 1) {
          drawVertText(fuList[0], cx, fuStartY, "16px serif", 22);
        } else {
          let step = pillarColW / (fuCount + 1);
          for (let f_idx = 0; f_idx < fuCount; f_idx++) {
            let fx = colX + step * (f_idx + 1);
            drawVertText(fuList[f_idx], fx, fuStartY, "16px serif", 22);
          }
        }

        // 5. 運 (十二長生，建祿等直書)
        let yunStartY = curY + zhuH + ganzhiH + cangH + fuH + yunH / 2;
        if (yunText.length <= 1) {
          drawText(yunText, cx, yunStartY, "bold 18px serif");
        } else {
          drawVertText(yunText, cx, curY + zhuH + ganzhiH + cangH + fuH + 14, "bold 18px serif", 20);
        }

        // 6. 神煞 (完全依原圖直排縱向排列，純深褐無花俏雜色)
        let ssStartY = curY + zhuH + ganzhiH + cangH + fuH + yunH;
        if (customSSCols) {
          let subCols = customSSCols[i];
          for (let sub of subCols) {
            let subX = colX + pillarColW * sub.x_ratio;
            for (let [s_name, s_top_offset] of sub.items) {
              drawVertText(s_name, subX, ssStartY + s_top_offset, "15px serif", 17, textColor);
            }
          }
        } else {
          // 通用縱向均勻分佈
          if (ssList.length <= 3) {
            let step = pillarColW / (ssList.length + 1);
            for (let s_idx = 0; s_idx < ssList.length; s_idx++) {
              let subX = colX + step * (s_idx + 1);
              drawVertText(ssList[s_idx], subX, ssStartY + 24, "15px serif", 18, textColor);
            }
          } else {
            let mid = Math.ceil(ssList.length / 2);
            let leftItems = ssList.slice(0, mid);
            let rightItems = ssList.slice(mid);
            let halfStep = pillarColW / 3;
            for (let s_idx = 0; s_idx < rightItems.length; s_idx++) {
              drawVertText(rightItems[s_idx], colX + halfStep * 2, ssStartY + 20 + s_idx * 75, "15px serif", 17, textColor);
            }
            for (let s_idx = 0; s_idx < leftItems.length; s_idx++) {
              drawVertText(leftItems[s_idx], colX + halfStep, ssStartY + 20 + s_idx * 75, "15px serif", 17, textColor);
            }
          }
        }
      }

      // ==========================================
      // 表格 2：【神煞說明對照表】 (x: 40, y: table2Y, w: 720)
      // 100% 依 myfate.herokuapp.com 官方原文順序與字樣！
      // ==========================================
      const table2Y = ly + table1H + 24;
      const nameW = 150;
      const r2H = 40;

      // 篩選出該命盤實際出現的神煞
      const allPillarSS = [];
      ["year", "month", "day", "hour"].forEach(k => {
        (pillarShenSha[k] || []).forEach(s => {
          if (!allPillarSS.includes(s)) allPillarSS.push(s);
        });
      });

      // 依照 myfate 原版順序排序顯示
      let activeList = [];
      MYFATE_SHENSHA_LIST.forEach(([s_name, s_desc]) => {
        if (allPillarSS.includes(s_name)) {
          activeList.push([s_name, s_desc]);
        }
      });
      if (activeList.length === 0) activeList = MYFATE_SHENSHA_LIST;

      const table2H = 44 + activeList.length * r2H;
      fillRect(lx, table2Y, lw, table2H, paperBg);
      strokeRect(lx, table2Y, lw, table2H, 1, borderLight);

      // 表頭
      fillRect(lx, table2Y, lw, 44, headerBg);
      line(lx, table2Y + 44, lx + lw, table2Y + 44, 1, borderLight);
      line(lx + nameW, table2Y, lx + nameW, table2Y + table2H, 1, borderLight);

      drawText("神煞", lx + nameW / 2, table2Y + 22, "bold 18px serif", "center", "#4a3e2d");
      drawText("說明", lx + nameW + 16, table2Y + 22, "bold 18px serif", "left", "#4a3e2d");

      // 每一列神煞與說明 (純粹原版深褐文字，絕不加入突兀雜色)
      for (let r_idx = 0; r_idx < activeList.length; r_idx++) {
        let [s_name, s_desc] = activeList[r_idx];
        let ry = table2Y + 44 + r_idx * r2H;

        if (r_idx % 2 === 1) {
          fillRect(lx, ry, lw, r2H, "#fdfaf2");
        }
        line(lx, ry + r2H, lx + lw, ry + r2H, 1, "#ede5d8");

        drawText(s_name, lx + nameW / 2, ry + r2H / 2, "bold 16px serif", "center", "#4a3319");
        drawText(s_desc, lx + nameW + 16, ry + r2H / 2, "15px serif", "left", "#2b2319");
      }
    }

    function calculateAndDraw() {
      const placeholder = document.getElementById("emptyPlaceholder");
      const wrapper = document.getElementById("chartWrapper");
      if (placeholder) placeholder.style.display = "none";
      if (wrapper) wrapper.style.display = "flex";

      const saveBtn = document.getElementById("btnSave");
      if (saveBtn) saveBtn.style.display = "inline-block";

      const rawName = document.getElementById("userName").value;
      const gender = document.getElementById("userGender").value;
      const year = parseInt(document.getElementById("inputYear").value);
      const month = parseInt(document.getElementById("inputMonth").value);
      const day = parseInt(document.getElementById("inputDay").value);
      const [h, m] = document.getElementById("inputHour").value.split(",").map(Number);

      const d = computeBazi(year, month, day, h, m, gender, rawName);
      drawBaziImage(d);
      drawShenshaCanvas(d);
    }

    function downloadImage() {
      const wrapper = document.getElementById("chartWrapper");
      if (!wrapper || wrapper.style.display === "none") {
        alert("請先點擊「⚡ 排盤更新」生成命盤後再下載！");
        return;
      }
      const canvas = document.getElementById("baziCanvas");
      const name = document.getElementById("userName").value || "無名氏";
      const link = document.createElement("a");
      link.download = `八字命盤_${name}_${document.getElementById("inputYear").value}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function openEmbedModal() { document.getElementById("embedModal").classList.add("active"); }
    function closeEmbedModal() { document.getElementById("embedModal").classList.remove("active"); }
    function copyIframeCode() {
      const t = document.getElementById("iframeCodeText").innerText;
      navigator.clipboard.writeText(t).then(() => alert("已複製 iframe 嵌入代碼！"));
    }

    initSelectors();
    // 預設不顯示任何人的數據，使用者點擊「排盤更新」或輸入後才顯示
    document.getElementById("userName").addEventListener("keydown", function(e) {
      if (e.key === "Enter") calculateAndDraw();
    });
  </script>
