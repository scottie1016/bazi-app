<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字命盤排盤系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header-bar {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border: 1px solid #e0dacf;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .header-title {
      font-size: 16px;
      font-weight: bold;
      color: #5c3a21;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-hint {
      font-size: 13px;
      color: #777;
    }
    .btn-embed {
      background: #8b2500;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-embed:hover {
      background: #a82e00;
    }
    .iframe-wrapper {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border: 1px solid #d4ccbd;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 900px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 彈窗樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      max-width: 620px;
      width: 100%;
      padding: 22px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px; right: 14px;
      background: none; border: none;
      font-size: 20px; cursor: pointer; color: #888;
    }
    .code-block {
      background: #1e1e1e;
      color: #9cdcfe;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 10px 0;
    }
    .btn-copy {
      background: #5c3a21;
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">☯ 八字命盤與無敵律數系統</div>
    <div class="header-hint">（直連官方引擎，100% 正確零誤差）</div>
    <button class="btn-embed" onclick="openEmbedModal()">＜/＞ 取得嵌入代碼</button>
  </div>

  <div class="iframe-wrapper">
    <iframe 
      id="fateFrame" 
      src="https://myfate.herokuapp.com/" 
      title="八字命盤系統">
    </iframe>
  </div>

  <!-- 彈窗 -->
  <div class="modal-overlay" id="embedModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeEmbedModal()">✕</button>
      <h3 style="margin-bottom:10px; color:#5c3a21;">＜/＞ 嵌入到您的任何網頁</h3>
      <p style="font-size:14px; color:#666; margin-bottom:10px;">
        在您希望呈現八字排盤的目標網站中，貼上以下代碼即可使用：
      </p>
      <div class="code-block" id="iframeCodeText">&lt;iframe src="https://scottie1016.github.io/" width="100%" height="920px" frameborder="0" style="border:none; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.08);"&gt;&lt;/iframe&gt;</div>
      <button class="btn-copy" onclick="copyIframeCode()">複製代碼</button>
    </div>
  </div>

  <script>
    function openEmbedModal() { document.getElementById("embedModal").classList.add("active"); }
    function closeEmbedModal() { document.getElementById("embedModal").classList.remove("active"); }
    function copyIframeCode() {
      const t = document.getElementById("iframeCodeText").innerText;
      navigator.clipboard.writeText(t).then(() => alert("已複製嵌入代碼！"));
    }
  </script>
</body>
</html>
